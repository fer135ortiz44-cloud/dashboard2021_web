<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SI Ejecutivo</title>
    <style>
        /* Colores corporativos oscuros */
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        
        /* Barra de navegación superior */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
        }
        .logo-area h1 {
            margin: 0;
            font-size: 28px;
            color: #ffffff;
        }
        .logo-area p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #94a3b8;
        }
        
        /* Botones del menú */
        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #334155;
            transition: background-color 0.3s;
        }
        .nav-links a:hover {
            background-color: #1e293b;
        }
        
        /* Botón de Cerrar Sesión */
        .btn-logout {
            background-color: #311c31; /* Tono rojizo oscuro */
            border: 1px solid #4a2735;
            padding: 8px 15px;
            border-radius: 20px;
            color: #fca5a5;
            cursor: pointer;
            font-size: 13px;
            margin-left: 10px;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background-color: #4a2735;
        }
        
        /* Contenedor donde irán las demás páginas */
        .container {
            padding: 40px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-area">
            <h1>SI Ejecutivo</h1>
            <p>Dashboard, reportes, comparativos y analítica avanzada</p>
        </div>
        <div class="nav-links">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_ventas' %}">Ventas</a>
            <a href="{% url 'reporte_mensual' %}">Reporte mensual</a>
            <a href="{% url 'dashboard_comparativo' %}">Comparativo</a>
            <a href="{% url 'analitica_avanzada' %}">Analítica</a>
            <a href="{% url 'agente_guia' %}">Agente guía</a>
            
            <a href="{% url 'mercado_tiempo_real' %}">Mercado</a>
            
            <a href="{% url 'lista_productos' %}">Productos</a>
            <a href="{% url 'lista_clientes' %}">Clientes</a>
            <a href="{% url 'lista_vendedores' %}">Vendedores</a>
            <a href="{% url 'lista_sucursales' %}">Sucursales</a>
            <a href="{% url 'lista_metodos_pago' %}">Métodos de pago</a>
            
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
