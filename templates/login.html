<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Ejecutivo</title>
    <style>
        body {
            background-color: #0f172a; /* Fondo azul oscuro corporativo */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b; /* Color de la tarjeta */
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-card h2 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
        }
        .login-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9; /* Botón azul brillante */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #0284c7;
        }
        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Ejecutivo</h2>
        <p>Ingrese sus credenciales para acceder al Sistema<br>de Inteligencia Comercial.</p>
        
        <!-- El formulario que envía los datos a Django -->
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="Ej. CEO" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar al panel</button>
        </form>

        <div class="footer-text">
            Uso exclusivo para dirección y análisis ejecutivo.
        </div>
    </div>

</body>
</html>
